name: build-mt6755-m5note

on:
  workflow_dispatch:          # 仅手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Install cross toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu flex bison libssl-dev bc kmod cpio

      - name: Cache kernel tarball
        id: cache-kernel
        uses: actions/cache@v4
        with:
          path: linux-6.12.115.tar.gz
          key: kernel-tarball-6.12.115

      - name: Download kernel 6.12.115
        if: steps.cache-kernel.outputs.cache-hit != 'true'
        run: wget -q https://mirrors.tuna.tsinghua.edu.cn/kernel/v6.x/linux-6.12.115.tar.gz

      - name: Extract kernel
        run: |
          tar xf linux-6.12.115.tar.gz
          echo "KERNEL_VERSION=$(make -C linux-6.12.115 -s kernelversion)" >> "$GITHUB_ENV"

      - name: Install board dts
        run: |
          K=linux-6.12.115
          cp mainline/dts/mt6755-m5note.dts $K/arch/arm64/boot/dts/mediatek/
          MK=$K/arch/arm64/boot/dts/mediatek/Makefile
          grep -q "mt6755-m5note.dtb" "$MK" || \
            sed -i "/mt6755-evb.dtb/a dtb-\$(CONFIG_ARCH_MEDIATEK) += mt6755-m5note.dtb" "$MK"
          echo 'DTC_FLAGS_mt6755-m5note := -@' >> "$MK"

      - name: Install driver patches
        run: |
          K=linux-6.12.115
          cp mainline/patches/pinctrl-mt6755.c \
             mainline/patches/pinctrl-mtk-mt6755.h $K/drivers/pinctrl/mediatek/
          cp mainline/patches/i2c-mt65xx.c $K/drivers/i2c/busses/
          cp mainline/patches/phy-mtk-tphy.c $K/drivers/phy/mediatek/

      - name: Configure (full server)
        run: |
          K=linux-6.12.115
          cp mainline/config/m5note-server.config $K/.config
          make -C $K ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig

      - name: Build kernel
        run: |
          K=linux-6.12.115
          make -C $K ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- \
            -j2 Image.gz dtbs modules
          echo "=== 内核编译完成，Module.symvers 已生成 ==="
          ls -lh $K/Module.symvers

      - name: Build CONSYS WiFi modules (out-of-tree)
        run: |
          K=$PWD/linux-6.12.115
          cd mainline/wifi
          make KDIR=$K ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CONSYS_PLAT=mt6755
          echo "=== CONSYS 模块 ==="
          find . -name "*.ko" -exec ls -lh {} \;

      - name: Collect artifacts
        run: |
          mkdir -p out/modules
          K=linux-6.12.115
          cp $K/arch/arm64/boot/Image.gz out/
          cp $K/arch/arm64/boot/dts/mediatek/mt6755-m5note.dtb out/
          cp $K/.config out/config
          # 内核内建模块（如果 =m 的）
          find $K -name "*.ko" -exec cp {} out/modules/ \; 2>/dev/null || true
          # CONSYS WiFi/BT 模块
          find mainline/wifi -name "*.ko" -exec cp {} out/modules/ \; 2>/dev/null || true
          echo "=== 产物 ==="
          ls -lh out/
          echo "=== 模块数 ==="
          ls out/modules/ | wc -l

      - uses: actions/upload-artifact@v4
        with:
          name: kernel-mt6755-m5note
          path: out/*
          retention-days: 30
