name: build-mt6755-m5note

on:
  workflow_dispatch:          # 仅手动触发

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install cross toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu flex bison libssl-dev bc kmod cpio libelf-dev rsync

      - name: Cache kernel tarball (7.3.1)
        id: cache-kernel
        uses: actions/cache@v4
        with:
          path: linux-7.3.1.tar.gz
          key: kernel-tarball-7.3.1

      - name: Download kernel 7.3.1
        if: steps.cache-kernel.outputs.cache-hit != 'true'
        run: wget -q https://mirrors.tuna.tsinghua.edu.cn/kernel/v7.x/linux-7.3.1.tar.gz

      - name: Restore incremental build tree (.o)
        id: cache-build
        uses: actions/cache@v4
        with:
          path: build-tree.tar
          key: buildtree-7.3.1-${{ github.run_id }}
          restore-keys: |
            buildtree-7.3.1-

      - name: Prepare kernel source
        run: |
          if [ -f build-tree.tar ]; then
            echo "=== 增量：恢复上次编译树 ==="
            tar xf build-tree.tar
          else
            echo "=== 首次：解压源码 ==="
            tar xf linux-7.3.1.tar.gz
            mv linux-7.3.1 linux
          fi
          echo "KERNEL_VERSION=$(make -C linux -s kernelversion)" >> "$GITHUB_ENV"

      - name: Apply 33 MT6755 patches (only on fresh tree)
        run: |
          if [ -f linux/drivers/tty/serial/earlycon-ram.c ]; then
            echo "=== 增量：patches 已应用（标记文件存在），跳过 ==="
            exit 0
          fi
          git config --global user.email ci@local
          git config --global user.name ci
          cd linux
          if [ ! -d .git ]; then
            git init -q
            git add -A && git commit -qm base
          fi
          git am --whitespace=nowarn ../mainline/7.3.1/patches/linux/*.patch
          echo "=== patches applied: $(git log --oneline | wc -l) ==="

      - name: Prepare build tree
        run: |
          cp mainline/7.3.1/build.sh .
          chmod +x build.sh
          # 安装 M5 Note 板级 dts（不改 pminervini 原始 patch 链）
          cp mainline/7.3.1/dts/mt6755-m5note.dts linux/arch/arm64/boot/dts/mediatek/
          grep -q "mt6755-m5note.dtb" linux/arch/arm64/boot/dts/mediatek/Makefile || {
            echo 'dtb-$(CONFIG_ARCH_MEDIATEK) += mt6755-m5note.dtb' >> linux/arch/arm64/boot/dts/mediatek/Makefile
            echo 'DTC_FLAGS_mt6755-m5note := -@' >> linux/arch/arm64/boot/dts/mediatek/Makefile
          }
          # build.sh 用 m5note dtb 拼接
          sed -i 's|mt6750-k50v1-tablet.dtb|mt6755-m5note.dtb|g' build.sh

      - name: Configure (pminervini fragments, only if missing)
        run: |
          export ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu-
          if [ -f out/.config ]; then
            echo "=== 增量：config 已存在，跳过 ==="
          else
            ./build.sh config
          fi
          # 外置充电 IC BQ25890（mainline 有原生驱动）
          linux/scripts/config --file out/.config -e CHARGER_BQ25890
          make -C linux O=out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- olddefconfig >/dev/null
          echo "=== config ==="
          grep -E "^CONFIG_(CGROUPS|NETFILTER|OVERLAY_FS|CFG80211|USB_MTU3|MMC_MTK|CHARGER_BQ25890)=" out/.config | head

      - name: Build kernel (incremental)
        run: |
          export ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu-
          ./build.sh
          echo "=== Image.gz-dtb ==="; ls -lh out/Image.gz-dtb

      - name: Build CONSYS WiFi modules (out-of-tree, 7.3.1 native)
        run: |
          cd mainline/wifi
          make KDIR=$GITHUB_WORKSPACE/out ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- CONSYS_PLAT=mt6755
          echo "=== CONSYS .ko ==="; find . -name "*.ko" -exec ls -lh {} \;

      - name: Collect artifacts
        run: |
          mkdir -p out_artifact/modules
          cp out/Image.gz-dtb out_artifact/
          cp out/.config out_artifact/config
          find out/modules -name "*.ko" -exec cp {} out_artifact/modules/ \; 2>/dev/null || true
          find mainline/wifi -name "*.ko" -exec cp {} out_artifact/modules/ \; 2>/dev/null || true
          echo "=== artifact ==="; ls -lh out_artifact/; echo "模块数: $(ls out_artifact/modules/ | wc -l)"

      - name: Pack build tree for next run
        run: |
          echo "=== 打包编译树供下次增量 ==="
          tar cf build-tree.tar linux out
          ls -lh build-tree.tar

      - uses: actions/upload-artifact@v4
        with:
          name: kernel-mt6755-m5note-7.3.1
          path: out_artifact/*
          retention-days: 30
